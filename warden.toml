version = 1

[defaults]
runtime = "pi"
failOn = "high"
reportOn = "medium"
ignorePaths = ["dist/**"]

[[skills]]
name = "code-review"
paths = ["packages/*/src/**/*.ts"]
ignorePaths = ["packages/*/src/**/*.test.ts"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]

[[skills]]
name = "security-review"
remote = "getsentry/sentry-skills"
paths = ["packages/*/src/**/*.ts"]
ignorePaths = ["packages/*/src/**/*.test.ts"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]

