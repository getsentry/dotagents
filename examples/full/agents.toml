version = 1
agents = ["claude", "cursor", "codex", "grok", "opencode", "pi"]

[[skills]]
name = "review"
source = "path:./local-skills/review"

[[skills]]
name = "commit"
source = "path:./local-skills/commit"

[[mcp]]
